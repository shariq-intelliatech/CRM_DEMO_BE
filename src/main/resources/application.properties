spring.application.name=CRM-Backend
server.port=8080

# Machine-specific settings (database password, dev users) live in application-local.properties next to the
# project, which git ignores. Production sets the same keys through environment variables.
spring.config.import=optional:file:./application-local.properties

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/CRM}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration (matching LMS standard)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.drop-first=false

# CRM behaviour
# "Today" for relative-date filters and formulas such as LinkedIn Connect Age (Weeks).
crm.time-zone=Australia/Sydney
# Origins allowed to call the API from a browser (the Vite dev server in development).
crm.cors.allowed-origins=${CRM_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
# Dev users (X-Dev-User header, seeded users u1-u4) until Cognito sign-in is wired. Off unless switched on locally.
crm.auth.dev-users=${CRM_DEV_USERS:false}

# AWS Cognito Security Configuration
# Can be overridden via env vars COGNITO_REGION, COGNITO_USER_POOL_ID
aws.cognito.region=${COGNITO_REGION:ap-southeast-2}
aws.cognito.userPoolId=${COGNITO_USER_POOL_ID:ap-southeast-2_xxxxxxxxx}
aws.cognito.jwkSetUri=https://cognito-idp.${aws.cognito.region}.amazonaws.com/${aws.cognito.userPoolId}/.well-known/jwks.json

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${aws.cognito.jwkSetUri}

# Spring AI Vector Store Configuration (pgvector)
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
